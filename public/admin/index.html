<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت دانیال دیجی</title>
    <script src="/assets/js/tailwind.js"></script>
        <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('/assets/css/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('/assets/css/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: 700;
        }
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex">
    <div class="w-64 bg-gray-900 text-white min-h-screen p-6 shadow-xl sticky top-0 h-screen">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-black text-blue-400">دانیال دیجی</h1>
            <p id="user-role" class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest"></p>
        </div>
        <nav id="sidebar-nav"></nav>
        <div class="absolute bottom-6 left-6 right-6 space-y-2">
             <a href="/shop/profile.html" class="block w-full text-center text-xs text-gray-400 hover:text-white transition">تنظیمات حساب</a>
             <button onclick="shop.logout()" class="w-full bg-red-900/20 text-red-400 border border-red-900/30 py-2 rounded-lg text-sm hover:bg-red-900/40 transition">خروج</button>
        </div>
    </div>

    <div class="flex-1 p-10">
        <header class="flex justify-between items-center mb-10 border-b pb-6">
            <div>
                <h2 class="text-3xl font-black text-gray-800">داشبورد</h2>
                <p class="text-gray-500 mt-1">مدیریت هوشمند فروشگاه دانیال دیجی</p>
            </div>
            <div class="flex items-center space-x-4 space-x-reverse">
                <div class="text-right">
                    <p id="user-name" class="font-bold text-gray-800"></p>
                    <p class="text-xs text-green-500">آنلاین</p>
                </div>
                <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-black shadow-lg shadow-blue-200">D</div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 hover:shadow-xl transition-all duration-300">
                <p class="text-gray-400 text-sm font-bold">کل فروش</p>
                <h3 id="total-sales" class="text-2xl font-black mt-2 text-gray-800">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 hover:shadow-xl transition-all duration-300">
                <p class="text-gray-400 text-sm font-bold">تعداد سفارشات</p>
                <h3 id="total-orders" class="text-2xl font-black mt-2 text-gray-800">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 hover:shadow-xl transition-all duration-300">
                <p class="text-gray-400 text-sm font-bold">در انتظار</p>
                <h3 id="pending-orders" class="text-2xl font-black mt-2 text-orange-500">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 hover:shadow-xl transition-all duration-300">
                <p class="text-gray-400 text-sm font-bold">محصولات</p>
                <h3 id="total-products" class="text-2xl font-black mt-2 text-gray-800">0</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                <h4 class="font-black text-xl mb-8 text-gray-800 border-r-4 border-blue-600 pr-4">آخرین فعالیت‌ها</h4>
                <div id="recent-orders" class="space-y-4"></div>
            </div>
            <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm flex flex-center items-center justify-center">
                 <p class="text-gray-300 italic">بخش نمودارها در حال توسعه است</p>
            </div>
        </div>
    </div>

    <script src="/shop/js/shop.js"></script>
    <script src="js/admin.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role === 'customer') window.location.href = '/shop/login.html';
        document.getElementById('user-name').innerText = user.full_name;
        document.getElementById('user-role').innerText = user.role.replace('_', ' ');

        const nav = document.getElementById('sidebar-nav');
        const links = [
            { h: 'index.html', t: 'داشبورد', a: true },
            { h: 'products.html', t: 'محصولات' },
            { h: 'categories.html', t: 'دسته‌بندی‌ها', r: 'admin' },
            { h: 'users.html', t: 'کاربران', r: 'admin' },
            { h: 'orders.html', t: 'سفارشات' }
        ];

        nav.innerHTML = `<ul class="space-y-2">${links.filter(l => !l.r || user.role === l.r).map(l => `
            <li><a href="${l.h}" class="block py-3 px-4 rounded-xl ${l.a ? 'bg-blue-600 text-white font-bold' : 'hover:bg-gray-800 transition'}">${l.t}</a></li>
        `).join('')}</ul>`;

        async function loadDashboard() {
            const stats = await admin.fetchStats();
            document.getElementById('total-sales').innerText = (stats.totalSales || 0).toLocaleString() + ' تومان';
            document.getElementById('total-orders').innerText = stats.totalOrders;
            document.getElementById('pending-orders').innerText = stats.pendingOrders;
            document.getElementById('total-products').innerText = stats.productCount;

            const orders = await admin.fetchOrders();
            const recent = document.getElementById('recent-orders');
            recent.innerHTML = orders.slice(0, 5).map(o => `
                <div class="flex justify-between items-center p-4 hover:bg-gray-50 rounded-2xl transition border-b last:border-0">
                    <div>
                        <p class="font-bold text-gray-800">${o.order_number}</p>
                        <p class="text-xs text-gray-400 mt-1">${new Date(o.createdAt).toLocaleString('fa-IR')}</p>
                    </div>
                    <span class="px-3 py-1 rounded-lg text-[10px] font-black ${o.status === 'pending' ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700'} uppercase">${o.status}</span>
                </div>
            `).join('');
        }
        loadDashboard();
    </script>
</body>
</html>
