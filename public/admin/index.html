<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-900 text-white min-h-screen p-6 shadow-xl sticky top-0 h-screen">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-black text-blue-400">پنل مدیریت</h1>
            <p id="user-role" class="text-xs text-gray-400 mt-1 uppercase"></p>
        </div>
        <nav id="sidebar-nav"></nav>
        <div class="absolute bottom-6 left-6 right-6">
            <button onclick="shop.logout()" class="w-full bg-red-900/20 text-red-400 border border-red-900/30 py-2 rounded-lg text-sm hover:bg-red-900/40 transition">خروج از حساب</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-10">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-3xl font-bold text-gray-800">داشبورد مدیریتی</h2>
                <p class="text-gray-500 mt-1">خلاصه وضعیت فروشگاه شما در یک نگاه</p>
            </div>
            <div id="user-info" class="bg-white p-3 rounded-xl border flex items-center space-x-3 space-x-reverse">
                <div class="text-right">
                    <p id="user-name" class="font-bold text-sm text-gray-800"></p>
                    <p class="text-xs text-green-500">آنلاین</p>
                </div>
                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">U</div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition">
                <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-2xl mb-4">💰</div>
                <p class="text-gray-500 text-sm">کل فروش</p>
                <h3 id="total-sales" class="text-2xl font-black mt-1">0 تومان</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition">
                <div class="w-12 h-12 bg-green-50 text-green-500 rounded-xl flex items-center justify-center text-2xl mb-4">📦</div>
                <p class="text-gray-500 text-sm">تعداد سفارشات</p>
                <h3 id="total-orders" class="text-2xl font-black mt-1">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition">
                <div class="w-12 h-12 bg-yellow-50 text-yellow-500 rounded-xl flex items-center justify-center text-2xl mb-4">🕒</div>
                <p class="text-gray-500 text-sm">سفارشات در انتظار</p>
                <h3 id="pending-orders" class="text-2xl font-black mt-1">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition">
                <div class="w-12 h-12 bg-purple-50 text-purple-500 rounded-xl flex items-center justify-center text-2xl mb-4">🏷️</div>
                <p class="text-gray-500 text-sm">تعداد محصولات</p>
                <h3 id="total-products" class="text-2xl font-black mt-1">0</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                <h4 class="font-bold mb-6 flex items-center">
                    <span class="ml-2">🔔</span> آخرین سفارشات
                </h4>
                <div id="recent-orders" class="space-y-4">
                    <!-- Loaded via JS -->
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                <h4 class="font-bold mb-6 flex items-center">
                    <span class="ml-2">🔥</span> محصولات پرفروش
                </h4>
                <div id="top-products" class="space-y-4">
                     <p class="text-gray-400 text-sm text-center py-10 italic">داده‌ای برای نمایش وجود ندارد</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/shop/js/shop.js"></script>
    <script src="js/admin.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role === 'customer') window.location.href = '/shop/login.html';

        document.getElementById('user-name').innerText = user.full_name;
        document.getElementById('user-role').innerText = user.role.replace('_', ' ');

        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = `
            <ul class="space-y-2">
                <li><a href="index.html" class="flex items-center py-3 px-4 rounded-xl bg-blue-600 text-white font-bold"><span class="ml-3">📊</span> داشبورد</a></li>
                <li><a href="products.html" class="flex items-center py-3 px-4 rounded-xl hover:bg-gray-800 transition"><span class="ml-3">🛍️</span> محصولات</a></li>
                ${user.role === 'admin' ? `<li><a href="categories.html" class="flex items-center py-3 px-4 rounded-xl hover:bg-gray-800 transition"><span class="ml-3">📁</span> دسته‌بندی‌ها</a></li>` : ''}
                ${user.role === 'admin' ? `<li><a href="users.html" class="flex items-center py-3 px-4 rounded-xl hover:bg-gray-800 transition"><span class="ml-3">👥</span> کاربران</a></li>` : ''}
                <li><a href="orders.html" class="flex items-center py-3 px-4 rounded-xl hover:bg-gray-800 transition"><span class="ml-3">📝</span> سفارشات</a></li>
            </ul>
        `;

        async function loadDashboard() {
            const stats = await admin.fetchStats();
            document.getElementById('total-sales').innerText = (stats.totalSales || 0).toLocaleString() + ' تومان';
            document.getElementById('total-orders').innerText = stats.totalOrders;
            document.getElementById('pending-orders').innerText = stats.pendingOrders;
            document.getElementById('total-products').innerText = stats.productCount;

            const orders = await admin.fetchOrders();
            const recent = document.getElementById('recent-orders');
            recent.innerHTML = orders.slice(0, 5).map(o => `
                <div class="flex justify-between items-center p-3 hover:bg-gray-50 rounded-lg transition border-b last:border-0">
                    <div>
                        <p class="font-bold text-sm text-gray-800">${o.order_number}</p>
                        <p class="text-xs text-gray-400 mt-1">${new Date(o.createdAt).toLocaleString('fa-IR')}</p>
                    </div>
                    <span class="px-2 py-1 rounded text-[10px] font-bold ${o.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}">${o.status}</span>
                </div>
            `).join('');
        }

        loadDashboard();
    </script>
</body>
</html>
