<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کاربران</title>
    <script src="/assets/js/tailwind.js"></script>
        <link rel="stylesheet" href="/assets/css/vazirmatn.css">
    <style>body { font-family: "Vazirmatn", sans-serif; }</style>
</head>
<body class="bg-gray-100 flex">
    <div class="w-64 bg-gray-800 text-white min-h-screen p-6">
        <h1 class="text-2xl font-bold mb-8 text-center">پنل مدیریت</h1>
        <nav id="sidebar-nav"></nav>
    </div>

    <div class="flex-1 p-10">
        <h2 class="text-3xl font-bold mb-10">مدیریت کاربران</h2>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <table class="w-full text-right">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-4">شناسه</th>
                        <th class="p-4">نام کامل</th>
                        <th class="p-4">ایمیل</th>
                        <th class="p-4">نقش</th>
                        <th class="p-4">وضعیت</th>
                        <th class="p-4">عملیات</th>
                    </tr>
                </thead>
                <tbody id="user-table"></tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl w-96 relative shadow-2xl">
            <h3 class="text-xl font-bold mb-6">ویرایش نقش کاربر</h3>
            <form id="user-form">
                <input type="hidden" id="user-id">
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-600 mb-1">نقش</label>
                    <select id="role" class="w-full border p-2 rounded-lg">
                        <option value="customer">مشتری (Customer)</option>
                        <option value="sales_manager">مدیر فروش (Sales Manager)</option>
                        <option value="admin">مدیر کل (Admin)</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-600 mb-1">وضعیت</label>
                    <select id="status" class="w-full border p-2 rounded-lg">
                        <option value="active">فعال</option>
                        <option value="disabled">غیرفعال</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-2 space-x-reverse">
                    <button type="button" onclick="closeModal()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg">انصراف</button>
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">ذخیره</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('user'));
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = `
            <ul class="space-y-2">
                <li><a href="index.html" class="block py-3 px-4 rounded-xl hover:bg-gray-800 transition">داشبورد</a></li>
                <li><a href="products.html" class="block py-3 px-4 rounded-xl hover:bg-gray-800 transition">محصولات</a></li>
                ${user.role === "admin" ? `<li><a href="categories.html" class="block py-3 px-4 rounded-xl hover:bg-gray-800 transition">دسته‌بندی‌ها</a></li>` : ""}
                ${user.role === "admin" ? `<li><a href="users.html" class="block py-3 px-4 rounded-xl hover:bg-gray-800 transition">کاربران</a></li>` : ""}
                <li><a href="orders.html" class="block py-3 px-4 rounded-xl hover:bg-gray-800 transition">سفارشات</a></li>
            </ul>
        `;

        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function loadUsers() {
            const res = await fetch('/api/users', {
                headers: { 'Authorization': `Bearer ${admin.getToken()}` }
            });
            const users = await res.json();
            const table = document.getElementById('user-table');
            table.innerHTML = users.map(u => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-4 text-gray-500">${u.id}</td>
                    <td class="p-4 font-bold">${admin.escapeHTML(u.full_name)}</td>
                    <td class="p-4">${admin.escapeHTML(u.email)}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded text-xs font-bold ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : (u.role === 'sales_manager' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-700')}">
                            ${u.role}
                        </span>
                    </td>
                    <td class="p-4">${u.status === 'active' ? ' فعال' : ' غیرفعال'}</td>
                    <td class="p-4">
                        <button onclick="editUser(${u.id}, '${u.role}', '${u.status}')" class="text-blue-500 hover:underline">تغییر نقش</button>
                    </td>
                </tr>
            `).join('');
        }

        function editUser(id, role, status) {
            document.getElementById('user-id').value = id;
            document.getElementById('role').value = role;
            document.getElementById('status').value = status;
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        document.getElementById('user-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('user-id').value;
            const data = {
                role: document.getElementById('role').value,
                status: document.getElementById('status').value
            };
            await fetch(`/api/users/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${admin.getToken()}`
                },
                body: JSON.stringify(data)
            });
            closeModal();
            loadUsers();
        };

        loadUsers();
    </script>
</body>
</html>
