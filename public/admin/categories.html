<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت دسته‌بندی‌ها</title>
    <script src="/assets/js/tailwind.js"></script>
        <link rel="stylesheet" href="/assets/css/vazirmatn.css">
    <style>body { font-family: "Vazirmatn", sans-serif; }</style>
</head>
<body class="bg-gray-50 flex">
    <div class="w-64 bg-gray-900 text-white min-h-screen p-6 shadow-xl sticky top-0 h-screen">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-black text-blue-400">پنل مدیریت</h1>
        </div>
        <nav id="sidebar-nav"></nav>
    </div>

    <div class="flex-1 p-10">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-bold text-gray-800">مدیریت دسته‌بندی‌ها</h2>
            <button onclick="openCreateModal()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">+ افزودن دسته‌بندی جدید</button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border p-8">
            <div id="category-list" class="space-y-6">
                <!-- Loaded via JS -->
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl w-96 relative shadow-2xl">
            <h3 id="modal-title" class="text-2xl font-bold mb-6 text-gray-800">دسته‌بندی جدید</h3>
            <form id="category-form">
                <input type="hidden" id="edit-id">
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-600 mb-1">نام دسته‌بندی</label>
                    <input type="text" id="name" class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-600 mb-1">دسته‌بندی والد</label>
                    <select id="parent_id" class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">-- اصلی --</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-2 space-x-reverse border-t pt-6">
                    <button type="button" onclick="closeModal()" class="bg-gray-100 text-gray-700 px-6 py-2 rounded-lg">انصراف</button>
                    <button type="submit" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-bold hover:bg-blue-700">ذخیره</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = `
            <ul class="space-y-2">
                <li><a href="index.html" class="block py-3 px-4 rounded-xl hover:bg-gray-800 transition">داشبورد</a></li>
                <li><a href="products.html" class="block py-3 px-4 rounded-xl hover:bg-gray-800 transition">محصولات</a></li>
                ${user.role === "admin" ? `<li><a href="categories.html" class="block py-3 px-4 rounded-xl hover:bg-gray-800 transition">دسته‌بندی‌ها</a></li>` : ""}
                ${user.role === "admin" ? `<li><a href="users.html" class="block py-3 px-4 rounded-xl hover:bg-gray-800 transition">کاربران</a></li>` : ""}
                <li><a href="orders.html" class="block py-3 px-4 rounded-xl hover:bg-gray-800 transition">سفارشات</a></li>
            </ul>
        `;

        function openCreateModal() {
            document.getElementById('modal-title').innerText = 'افزودن دسته‌بندی جدید';
            document.getElementById('edit-id').value = '';
            document.getElementById('name').value = '';
            document.getElementById('parent_id').value = '';
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        async function editCategory(id, name, parentId) {
            document.getElementById('modal-title').innerText = 'ویرایش دسته‌بندی';
            document.getElementById('edit-id').value = id;
            document.getElementById('name').value = name;
            document.getElementById('parent_id').value = parentId || '';
            document.getElementById('modal').classList.remove('hidden');
        }

        async function loadCategories() {
            const res = await fetch('/api/categories');
            const categories = await res.json();
            const list = document.getElementById('category-list');
            const select = document.getElementById('parent_id');

            list.innerHTML = categories.map(c => `
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <div class="flex justify-between items-center">
                        <span class="font-black text-lg text-gray-800">${admin.escapeHTML(c.name)}</span>
                        <div class="space-x-4 space-x-reverse">
                            <button onclick="editCategory(${c.id}, '${admin.escapeHTML(c.name).replace(/'/g, "\\'")}', null)" class="text-blue-600 text-sm font-bold">ویرایش</button>
                            <button onclick="deleteCategory(${c.id})" class="text-red-500 text-sm font-bold">حذف</button>
                        </div>
                    </div>
                    ${c.children?.length ? `
                        <div class="mr-8 mt-4 space-y-2 border-r-2 border-gray-200 pr-4">
                            ${c.children.map(sub => `
                                <div class="flex justify-between items-center py-1">
                                    <span class="text-gray-600 font-bold">${admin.escapeHTML(sub.name)}</span>
                                    <div class="space-x-3 space-x-reverse">
                                        <button onclick="editCategory(${sub.id}, '${admin.escapeHTML(sub.name).replace(/'/g, "\\'")}', ${c.id})" class="text-blue-400 text-xs font-bold">ویرایش</button>
                                        <button onclick="deleteCategory(${sub.id})" class="text-red-300 text-xs font-bold">حذف</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');

            select.innerHTML = '<option value="">-- اصلی --</option>' +
                categories.map(c => `<option value="${c.id}">${admin.escapeHTML(c.name)}</option>`).join('');
        }

        async function deleteCategory(id) {
            if (confirm('آیا مطمئن هستید؟ (محصولات این دسته بدون دسته خواهند شد)')) {
                await fetch(`/api/categories/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${admin.getToken()}` }
                });
                loadCategories();
            }
        }

        document.getElementById('category-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const data = {
                name: document.getElementById('name').value,
                parent_id: document.getElementById('parent_id').value || null
            };

            const url = id ? `/api/categories/${id}` : '/api/categories';
            const method = id ? 'PUT' : 'POST';

            await fetch(url, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${admin.getToken()}`
                },
                body: JSON.stringify(data)
            });

            closeModal();
            loadCategories();
        };

        loadCategories();
    </script>
</body>
</html>
