<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود</title>
    <script src="/assets/js/tailwind.js"></script>
        <link rel="stylesheet" href="/assets/css/vazirmatn.css">
    <style>body { font-family: "Vazirmatn", sans-serif; }</style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h1 class="text-2xl font-bold mb-6 text-center">ورود به حساب</h1>
        <form id="login-form">
            <div class="mb-4">
                <label class="block text-gray-700">ایمیل</label>
                <input type="email" id="email" class="w-full border p-2 rounded mt-1" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700">رمز عبور</label>
                <input type="password" id="password" class="w-full border p-2 rounded mt-1" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">ورود</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">هنوز ثبت نام نکرده‌اید؟ <a href="#" class="text-blue-500">ثبت نام</a></p>
    </div>

    <script src="js/shop.js"></script>
    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const res = await shop.login(email, password);
            if (res.token) {
                window.location.href = 'index.html';
            } else {
                alert(res.message || 'خطا در ورود');
            }
        };
    </script>
</body>
</html>
