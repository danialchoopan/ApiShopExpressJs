<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سبد خرید</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg p-4 mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-blue-600">فروشگاه من</a>
        </div>
    </nav>

    <div class="container mx-auto px-4">
        <h1 class="text-3xl font-bold mb-6">سبد خرید شما</h1>
        <div id="cart-content" class="bg-white p-6 rounded-lg shadow-md">
            <!-- Cart items will be loaded here -->
        </div>
    </div>

    <script src="js/shop.js"></script>
    <script>
        async function loadCart() {
            const data = await shop.getCart();
            const container = document.getElementById('cart-content');
            if (!data || !data.items || data.items.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-600">سبد خرید شما خالی است.</p>';
                return;
            }

            container.innerHTML = `
                <table class="w-full text-right mb-6">
                    <thead>
                        <tr class="border-b">
                            <th class="py-2">محصول</th>
                            <th class="py-2">قیمت واحد</th>
                            <th class="py-2">تعداد</th>
                            <th class="py-2">جمع</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.items.map(it => `
                            <tr class="border-b">
                                <td class="py-4">${it.Product.title}</td>
                                <td class="py-4">${it.unit_price.toLocaleString()} تومان</td>
                                <td class="py-4">${it.quantity}</td>
                                <td class="py-4">${(it.quantity * it.unit_price).toLocaleString()} تومان</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div class="flex justify-between items-center font-bold text-xl">
                    <span>جمع کل:</span>
                    <span>${data.total.toLocaleString()} تومان</span>
                </div>
                <div class="mt-8">
                    <a href="checkout.html" class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700 block text-center">ادامه فرآیند خرید</a>
                </div>
            `;
        }

        loadCart();
    </script>
</body>
</html>
